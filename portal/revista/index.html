<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revista digital | Panorama Sociodemográfico</title>
  <link rel="icon" href="../../assets/logo-sdh-icon.png">
  <link rel="stylesheet" href="revista.css">
  <script defer src="revista.js"></script>
</head>
<body>
  <header>
    <a href="../">Volver al Panorama</a>
    <h1>Revista digital</h1>
  </header>
  <main>
    <nav aria-label="Navegación de la revista">
      <button id="indice" disabled>Índice</button>
      <button id="anterior" disabled>Anterior</button>
      <form id="salto">
        <label for="numero">Hoja</label>
        <input id="numero" type="number" min="1" value="1" required disabled>
        <span id="total"></span>
        <button id="ir" disabled>Ir</button>
      </form>
      <button id="siguiente" disabled>Siguiente</button>
      <button id="zoom" aria-pressed="false" disabled>Ampliar</button>
    </nav>
    <p id="estado" role="status">Cargando revista…</p>
    <div id="visor"><div id="hoja"></div></div>
  </main>
</body>
</html>
